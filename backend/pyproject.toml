[project]
name = "tribe-virality-backend"
version = "0.1.0"
description = "FastAPI backend for TRIBE v2 virality scoring"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "Pillow>=10.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
render = [
    "matplotlib>=3.8",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4",
    "nilearn>=0.10",
    "nibabel>=5.0",
]
tribe = [
    # Installed separately via: pip install -e path/to/tribev2
    # Left as an extras marker for docs only.
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
