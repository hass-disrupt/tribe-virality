build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
    - "git"
  python_requirements: "requirements.txt"
  run:
    # Bake all model weights into the image at push time. The user passes
    # HUGGING_FACE_HUB_TOKEN as a build secret:
    #   cog push --secret HUGGING_FACE_HUB_TOKEN=hf_xxx r8.im/...
    # The token is only present during build; it is not embedded in the
    # final image. Llama-3.2-3B is gated so this token is required.
    - command: |
        HUGGING_FACE_HUB_TOKEN=$(cat /run/secrets/HUGGING_FACE_HUB_TOKEN) \
          python -c "from tribev2.demo_utils import TribeModel; TribeModel.from_pretrained('facebook/tribev2', cache_folder='/src/cache')"
      mounts:
        - type: secret
          id: HUGGING_FACE_HUB_TOKEN
          target: /run/secrets/HUGGING_FACE_HUB_TOKEN

predict: "predict.py:Predictor"
