build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
    - "git"
  python_requirements: "requirements.txt"
  run:
    # Bake all model weights into the image at push time. The user passes
    # HUGGING_FACE_HUB_TOKEN as a build secret:
    #   cog push --secret id=HUGGING_FACE_HUB_TOKEN,src=/path/to/hf_token ...
    # The token is only present during build; it is not embedded in the
    # final image. Llama-3.2-3B is gated so this token is required.
    #
    # NOTE: Cog's `run:` steps execute BEFORE the source tree is copied into
    # the image, so we can't reference a script under /src. Inline instead.
    # YAML's `''` inside a single-quoted string is a literal single quote.
    - command: 'TOKEN=$(cat /run/secrets/HUGGING_FACE_HUB_TOKEN); if [ -z "$TOKEN" ]; then echo "ERROR: HF token from secret is empty" >&2; exit 1; fi; export HF_TOKEN="$TOKEN"; export HUGGING_FACE_HUB_TOKEN="$TOKEN"; mkdir -p /root/.cache/huggingface /src/cache; printf "%s" "$TOKEN" > /root/.cache/huggingface/token && python -c "import os; from huggingface_hub import snapshot_download; from transformers import AutoConfig; from tribev2.demo_utils import TribeModel; tok = os.environ.get(''HF_TOKEN''); print(f''[bake] token len: {len(tok) if tok else 0}'', flush=True); print(''[bake] downloading TRIBE...'', flush=True); TribeModel.from_pretrained(''facebook/tribev2'', cache_folder=''/src/cache''); print(''[bake] downloading Llama-3.2-3B...'', flush=True); p = snapshot_download(repo_id=''meta-llama/Llama-3.2-3B'', token=tok); print(f''[bake] Llama dir: {p}'', flush=True); cfg = AutoConfig.from_pretrained(''meta-llama/Llama-3.2-3B'', token=tok); print(f''[bake] Llama model_type: {cfg.model_type}'', flush=True)" && du -sh /src/cache && du -sh /root/.cache/huggingface'
      mounts:
        - type: secret
          id: HUGGING_FACE_HUB_TOKEN
          target: /run/secrets/HUGGING_FACE_HUB_TOKEN
    # Separate step (kept out of the heavy bake above so its Docker layer cache
    # survives) that warms transformers'' own cache layout for Llama-3.2-3B's
    # tokenizer. Without this, runtime AutoTokenizer.from_pretrained tries a
    # network fetch for tokenizer.model and 401s against the gated repo since
    # the HF token is intentionally not shipped in the image.
    - command: 'TOKEN=$(cat /run/secrets/HUGGING_FACE_HUB_TOKEN); if [ -z "$TOKEN" ]; then echo "ERROR: HF token from secret is empty" >&2; exit 1; fi; export HF_TOKEN="$TOKEN"; export HUGGING_FACE_HUB_TOKEN="$TOKEN"; python -c "import os; from transformers import AutoTokenizer; tok = os.environ.get(''HF_TOKEN''); tk = AutoTokenizer.from_pretrained(''meta-llama/Llama-3.2-3B'', token=tok); print(f''[bake-tk] vocab {tk.vocab_size}, type {type(tk).__name__}'', flush=True)"'
      mounts:
        - type: secret
          id: HUGGING_FACE_HUB_TOKEN
          target: /run/secrets/HUGGING_FACE_HUB_TOKEN

predict: "predict.py:Predictor"
