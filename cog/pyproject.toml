[project]
name = "cog-tribe-virality"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  # Build-time only: regenerating data/roi_mapping.json from the Destrieux
  # atlas. NOT a runtime dependency — the image only reads the baked JSON.
  "nilearn>=0.10",
]

[tool.setuptools]
packages = ["scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
