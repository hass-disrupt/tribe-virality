[project]
name = "cog-tribe-virality"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools]
packages = ["scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
